services:
  api-solid-pg:
    container_name: api_solid_db
    image: postgres:17-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=apisolid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d apisolid"]
      interval: 5s
      timeout: 3s
      retries: 10
